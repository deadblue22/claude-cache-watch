name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Test CLI
        run: python3 -m unittest discover -s tests
      - name: Build macOS App
        run: ./scripts/build-app.sh
