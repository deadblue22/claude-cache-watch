[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cache-watch"
version = "0.1.0"
description = "Local Claude Code prompt-cache TTL monitor"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-cache-watch = "claude_cache_watch:main"

[tool.setuptools]
py-modules = ["claude_cache_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
